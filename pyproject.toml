[project]
name = "broadcast-server"
version = "0.1.0"
description = "A WebSocket chat server and command-line client."
readme = "README.md"
authors = [
    { name = "Marcos Achaval", email = "marcos.achavalr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "websockets>=17.2",
]

[project.scripts]
broadcast-server = "broadcast_server:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
