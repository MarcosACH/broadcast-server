[project]
name = "broadcast-server"
version = "0.1.0"
description = "A WebSocket chat server and command-line client."
readme = "README.md"
authors = [
    { name = "Marcos Achaval", email = "marcos.achavalr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "websockets>=17.2",
]

[project.scripts]
broadcast-server = "broadcast_server.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
asyncio_mode = "auto"
